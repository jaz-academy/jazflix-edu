<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazflix TV</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      user-select: none;
    }
    .logo {
      font-size: 3rem;
      font-weight: 900;
      color: #e50914;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(229, 9, 20, 0.2);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 1rem;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="logo">JAZFLIX</div>
  <div class="spinner"></div>
  <div class="status">Menghubungkan ke server Jazflix...</div>
</body>
</html>
